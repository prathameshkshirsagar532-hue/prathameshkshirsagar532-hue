<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', Courier, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="100%" stop-color="#0a1424"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="frame">
      <rect x="0" y="0" width="900" height="220" rx="10"/>
    </clipPath>

    <clipPath id="typeMask">
      <rect x="0" y="0" width="0" height="30">
        <animate attributeName="width" values="0;330;330;0" keyTimes="0;0.35;0.85;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="220" fill="url(#bg)"/>

    <!-- matrix rain -->
    <g fill="#1FE07A" font-size="14" opacity="0.35">
      <text x="20" y="0">01<tspan x="20" dy="16">10</tspan><tspan x="20" dy="16">ア</tspan><tspan x="20" dy="16">01</tspan><tspan x="20" dy="16">ル</tspan><tspan x="20" dy="16">10</tspan><tspan x="20" dy="16">ネ</tspan><tspan x="20" dy="16">01</tspan>
        <animateTransform attributeName="transform" type="translate" values="0,-140;0,220" dur="5s" begin="0s" repeatCount="indefinite"/>
      </text>
      <text x="70" y="0">1<tspan x="70" dy="16">0</tspan><tspan x="70" dy="16">ソ</tspan><tspan x="70" dy="16">1</tspan><tspan x="70" dy="16">0</tspan><tspan x="70" dy="16">キ</tspan><tspan x="70" dy="16">1</tspan>
        <animateTransform attributeName="transform" type="translate" values="0,-140;0,220" dur="4.2s" begin="0.8s" repeatCount="indefinite"/>
      </text>
      <text x="140" y="0">ミ<tspan x="140" dy="16">01</tspan><tspan x="140" dy="16">10</tspan><tspan x="140" dy="16">タ</tspan><tspan x="140" dy="16">01</tspan><tspan x="140" dy="16">ハ</tspan>
        <animateTransform attributeName="transform" type="translate" values="0,-140;0,220" dur="6s" begin="1.4s" repeatCount="indefinite"/>
      </text>
      <text x="780" y="0">10<tspan x="780" dy="16">ネ</tspan><tspan x="780" dy="16">01</tspan><tspan x="780" dy="16">10</tspan><tspan x="780" dy="16">ハ</tspan><tspan x="780" dy="16">01</tspan>
        <animateTransform attributeName="transform" type="translate" values="0,-140;0,220" dur="5.4s" begin="0.4s" repeatCount="indefinite"/>
      </text>
      <text x="830" y="0">ク<tspan x="830" dy="16">01</tspan><tspan x="830" dy="16">10</tspan><tspan x="830" dy="16">ミ</tspan><tspan x="830" dy="16">01</tspan><tspan x="830" dy="16">10</tspan>
        <animateTransform attributeName="transform" type="translate" values="0,-140;0,220" dur="4.8s" begin="1.1s" repeatCount="indefinite"/>
      </text>
      <text x="60" y="0" fill="#22D3EE">01<tspan x="60" dy="16">ハ</tspan><tspan x="60" dy="16">10</tspan><tspan x="60" dy="16">01</tspan>
        <animateTransform attributeName="transform" type="translate" values="0,-140;0,220" dur="3.6s" begin="2s" repeatCount="indefinite"/>
      </text>
      <text x="820" y="0" fill="#22D3EE">10<tspan x="820" dy="16">01</tspan><tspan x="820" dy="16">ク</tspan><tspan x="820" dy="16">10</tspan>
        <animateTransform attributeName="transform" type="translate" values="0,-140;0,220" dur="4.4s" begin="0.2s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- corner circuit brackets -->
    <g stroke="#22D3EE" stroke-width="1.4" fill="none" opacity="0.7">
      <path d="M18,18 L18,42 M18,18 L42,18"/>
      <path d="M882,18 L882,42 M882,18 L858,18"/>
      <path d="M18,202 L18,178 M18,202 L42,202"/>
      <path d="M882,202 L882,178 M882,202 L858,202"/>
    </g>

    <!-- top status line -->
    <text x="450" y="38" text-anchor="middle" font-size="13" fill="#4ADE80" letter-spacing="2" opacity="0.9">
      root@prathamesh:~$ ./access_granted.sh
    </text>

    <circle cx="450" cy="70" r="3" fill="#22D3EE">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>

    <!-- MAIN NAME - the flex -->
    <text x="450" y="130" text-anchor="middle" font-size="66" font-weight="bold"
          fill="url(#nameGrad)" filter="url(#glow)" letter-spacing="6">
      PRATHAMESH
      <animate attributeName="opacity" values="1;0.85;1;0.9;1" dur="2.4s" repeatCount="indefinite"/>
    </text>
    <text x="452" y="130" text-anchor="middle" font-size="66" font-weight="bold"
          fill="#FF2E63" letter-spacing="6" opacity="0">
      PRATHAMESH
      <animate attributeName="opacity" values="0;0;0.5;0;0;0;0.4;0" keyTimes="0;0.42;0.44;0.46;0.7;0.72;0.74;1" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="x" values="452;448;452" dur="3.2s" repeatCount="indefinite"/>
    </text>

    <!-- typing line -->
    <g clip-path="url(#typeMask)">
      <text x="285" y="168" font-size="18" fill="#94A3B8" letter-spacing="1">
        &gt; SDE // Full-Stack Developer
      </text>
    </g>
    <rect x="285" y="152" width="2" height="18" fill="#4ADE80">
      <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
    </rect>

    <!-- bottom tag -->
    <text x="450" y="198" text-anchor="middle" font-size="12" fill="#22D3EE" letter-spacing="3" opacity="0.75">
      [ STATUS: ONLINE ]   [ ROLE: BUILDER ]   [ MODE: UNSTOPPABLE ]
    </text>

    <!-- scanlines -->
    <g opacity="0.06">
      <rect x="0" y="0" width="900" height="220" fill="url(#bg)"/>
      <path d="M0,0 H900 M0,4 H900 M0,8 H900 M0,12 H900 M0,16 H900" stroke="#000" stroke-width="1">
        <animateTransform attributeName="transform" type="translate" values="0,0;0,20" dur="0.6s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <rect x="1" y="1" width="898" height="218" rx="10" fill="none" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="1"/>
</svg>
