<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', Courier, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="50%" stop-color="#020805"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <radialGradient id="glowSpot" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#065f46" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#065f46" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39FF88"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#39FF88"/>
    </linearGradient>

    <linearGradient id="edgeFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="1"/>
      <stop offset="8%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="92%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="frame">
      <rect x="0" y="0" width="900" height="220" rx="12"/>
    </clipPath>

    <clipPath id="typeMask">
      <rect x="0" y="164" width="0" height="26">
        <animate attributeName="width" values="0;380;380;0" keyTimes="0;0.35;0.85;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0 L0 0 0 34" fill="none" stroke="#0f2418" stroke-width="0.6"/>
    </pattern>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="220" fill="url(#bg)"/>
    <rect width="900" height="220" fill="url(#grid)" opacity="0.5"/>
    <rect width="900" height="220" fill="url(#glowSpot)"/>

    <!-- scrolling source-code lines (left + right columns, behind everything) -->
    <g fill="#1FE07A" font-size="11" opacity="0.32">
      <text x="10" y="0">def scan(target):
        <animateTransform attributeName="transform" type="translate" values="0,-40;0,240" dur="9s" begin="0s" repeatCount="indefinite"/>
      </text>
      <text x="10" y="14">&#160;&#160;&#160;&#160;for port in ports:
        <animateTransform attributeName="transform" type="translate" values="0,-40;0,240" dur="9s" begin="0s" repeatCount="indefinite"/>
      </text>
      <text x="10" y="28">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;sock.connect(ip)
        <animateTransform attributeName="transform" type="translate" values="0,-40;0,240" dur="9s" begin="0s" repeatCount="indefinite"/>
      </text>
      <text x="10" y="42">&#160;&#160;&#160;&#160;return open_ports
        <animateTransform attributeName="transform" type="translate" values="0,-40;0,240" dur="9s" begin="0s" repeatCount="indefinite"/>
      </text>
      <text x="10" y="56">class Server(Thread):
        <animateTransform attributeName="transform" type="translate" values="0,-40;0,240" dur="9s" begin="0s" repeatCount="indefinite"/>
      </text>
      <text x="10" y="70">&#160;&#160;&#160;&#160;def run(self):
        <animateTransform attributeName="transform" type="translate" values="0,-40;0,240" dur="9s" begin="0s" repeatCount="indefinite"/>
      </text>

      <text x="700" y="0" fill="#22D3EE">import numpy as np
        <animateTransform attributeName="transform" type="translate" values="0,240;0,-40" dur="10s" begin="0.5s" repeatCount="indefinite"/>
      </text>
      <text x="700" y="14" fill="#22D3EE">model.fit(X_train, y)
        <animateTransform attributeName="transform" type="translate" values="0,240;0,-40" dur="10s" begin="0.5s" repeatCount="indefinite"/>
      </text>
      <text x="700" y="28" fill="#22D3EE">&#160;&#160;&#160;&#160;git commit -m "fix"
        <animateTransform attributeName="transform" type="translate" values="0,240;0,-40" dur="10s" begin="0.5s" repeatCount="indefinite"/>
      </text>
      <text x="700" y="42" fill="#22D3EE">sudo systemctl start
        <animateTransform attributeName="transform" type="translate" values="0,240;0,-40" dur="10s" begin="0.5s" repeatCount="indefinite"/>
      </text>
      <text x="700" y="56" fill="#22D3EE">while True: build()
        <animateTransform attributeName="transform" type="translate" values="0,240;0,-40" dur="10s" begin="0.5s" repeatCount="indefinite"/>
      </text>
      <text x="700" y="70" fill="#22D3EE">return response.json()
        <animateTransform attributeName="transform" type="translate" values="0,240;0,-40" dur="10s" begin="0.5s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- code-symbol rain (no katakana) -->
    <g fill="#1FE07A" font-size="13" opacity="0.4">
      <text x="130" y="0">{ }<tspan x="130" dy="15">=&gt;</tspan><tspan x="130" dy="15">&amp;&amp;</tspan><tspan x="130" dy="15">01</tspan><tspan x="130" dy="15">&lt;/&gt;</tspan><tspan x="130" dy="15">10</tspan>
        <animateTransform attributeName="transform" type="translate" values="0,-140;0,220" dur="4.6s" begin="0s" repeatCount="indefinite"/>
      </text>
      <text x="175" y="0">;<tspan x="175" dy="15">0x1F</tspan><tspan x="175" dy="15">||</tspan><tspan x="175" dy="15">git</tspan><tspan x="175" dy="15">npm</tspan>
        <animateTransform attributeName="transform" type="translate" values="0,-140;0,220" dur="3.8s" begin="0.9s" repeatCount="indefinite"/>
      </text>
      <text x="220" y="0" fill="#22D3EE">#!/bin<tspan x="220" dy="15">01</tspan><tspan x="220" dy="15">( )</tspan><tspan x="220" dy="15">10</tspan>
        <animateTransform attributeName="transform" type="translate" values="0,-140;0,220" dur="5.6s" begin="0.4s" repeatCount="indefinite"/>
      </text>
      <text x="600" y="0">10<tspan x="600" dy="15">== </tspan><tspan x="600" dy="15">01</tspan><tspan x="600" dy="15">sh</tspan><tspan x="600" dy="15">&amp;&amp;</tspan>
        <animateTransform attributeName="transform" type="translate" values="0,-140;0,220" dur="5.1s" begin="0.2s" repeatCount="indefinite"/>
      </text>
      <text x="645" y="0" fill="#22D3EE">curl<tspan x="645" dy="15">01</tspan><tspan x="645" dy="15">{ }</tspan><tspan x="645" dy="15">10</tspan>
        <animateTransform attributeName="transform" type="translate" values="0,-140;0,220" dur="4.2s" begin="1.4s" repeatCount="indefinite"/>
      </text>
    </g>

    <rect width="900" height="220" fill="url(#edgeFade)" opacity="0.8"/>

    <!-- terminal window chrome -->
    <g opacity="0.85">
      <rect x="14" y="14" width="872" height="26" rx="6" fill="#020805" stroke="#134e34" stroke-width="1"/>
      <circle cx="28" cy="27" r="4" fill="#FF5F56"/>
      <circle cx="42" cy="27" r="4" fill="#FFBD2E"/>
      <circle cx="56" cy="27" r="4" fill="#27C93F"/>
      <text x="450" y="31" text-anchor="middle" font-size="11.5" fill="#39FF88" letter-spacing="2" opacity="0.9">root@prathamesh: ~/portfolio</text>
    </g>

    <circle cx="820" cy="27" r="3" fill="#22D3EE">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>

    <!-- prompt line -->
    <text x="60" y="66" font-size="13" fill="#39FF88" letter-spacing="1" opacity="0.9">$ whoami</text>

    <!-- MAIN NAME - stylized / glitch -->
    <text x="450" y="126" text-anchor="middle" font-size="60" font-weight="bold"
          fill="url(#nameGrad)" filter="url(#glow)" letter-spacing="6">
      &lt;PRATHAMESH/&gt;
      <animate attributeName="opacity" values="1;0.88;1;0.9;1" dur="2.4s" repeatCount="indefinite"/>
    </text>
    <text x="453" y="126" text-anchor="middle" font-size="60" font-weight="bold"
          fill="#FF2E63" letter-spacing="6" opacity="0">
      &lt;PRATHAMESH/&gt;
      <animate attributeName="opacity" values="0;0;0.5;0;0;0;0.4;0" keyTimes="0;0.42;0.44;0.46;0.7;0.72;0.74;1" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="x" values="453;447;453" dur="3.2s" repeatCount="indefinite"/>
    </text>
    <text x="447" y="126" text-anchor="middle" font-size="60" font-weight="bold"
          fill="#22D3EE" letter-spacing="6" opacity="0">
      &lt;PRATHAMESH/&gt;
      <animate attributeName="opacity" values="0;0;0.4;0;0;0;0.3;0" keyTimes="0;0.5;0.52;0.54;0.8;0.82;0.84;1" dur="3.2s" repeatCount="indefinite"/>
    </text>

    <rect x="270" y="140" width="360" height="2" fill="url(#nameGrad)" opacity="0.55" filter="url(#softGlow)"/>

    <!-- typing line -->
    <g clip-path="url(#typeMask)">
      <text x="200" y="182" font-size="17" fill="#94A3B8" letter-spacing="1">
        &gt; system.identity = "SDE // Full-Stack Dev // Hacker Mindset"
      </text>
    </g>
    <rect x="200" y="166" width="2" height="18" fill="#39FF88">
      <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
    </rect>

    <!-- bottom status tags -->
    <g font-size="11" fill="#22D3EE" letter-spacing="2" opacity="0.8">
      <text x="450" y="205" text-anchor="middle">[ STATUS: ONLINE ]&#160;&#160;&#160;[ ROLE: BUILDER ]&#160;&#160;&#160;[ ACCESS: ROOT ]&#160;&#160;&#160;[ MODE: UNSTOPPABLE ]</text>
    </g>

    <!-- scanlines -->
    <g opacity="0.06">
      <path d="M0,0 H900 M0,4 H900 M0,8 H900 M0,12 H900 M0,16 H900" stroke="#000" stroke-width="1">
        <animateTransform attributeName="transform" type="translate" values="0,0;0,20" dur="0.6s" repeatCount="indefinite"/>
      </path>
    </g>

    <rect width="900" height="220" fill="#000" opacity="0.1" style="mix-blend-mode:multiply"/>
  </g>

  <rect x="1" y="1" width="898" height="218" rx="12" fill="none" stroke="#39FF88" stroke-opacity="0.45" stroke-width="1.2"/>
</svg>
